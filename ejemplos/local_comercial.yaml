# Ejemplo: local comercial en planta baja entre medianeras, con viviendas encima.
# Unidades: m, m², W, °C. Áreas de muro NETAS (sin huecos).
# Capas siempre de INTERIOR a EXTERIOR. Cada capa puede ser:
#   - un material del catálogo CTE: {material: "<nombre oficial>", espesor: m}
#   - o propia: {nombre, espesor, conductividad, densidad, calor_especifico} / {resistencia}
# También se puede usar una solución completa del catálogo: solucion: "<nombre>"
# o dar sólo 'U'. Para buscar nombres:  python -m cargas_rite.buscar lana mineral

proyecto:
  titulo: "Local comercial — ejemplo"
  autor: ""

metodo_verano: dinamico        # dinamico (por defecto) | simplificado (conservador)

clima:
  latitud: 40.41
  longitud: -3.70
  altitud: 667
  diferencia_horaria: 2        # hora oficial - UTC en el mes de cálculo (verano peninsular = 2)
  huso: 1                      # hora estándar - UTC (península 1, Canarias 0)
  mes_verano: 7
  modelo_cielo: ashrae         # ashrae | ineichen
  temperatura_media_anual: 15.0  # ILUSTRATIVO: temperatura del terreno (soleras)
  invierno:
    temperatura_seca: -3.0     # ILUSTRATIVO: sustituir por el percentil de la Guía IDAE
  verano:
    temperatura_seca: 36.0     # ILUSTRATIVO
    temperatura_humeda_coincidente: 21.5
    oscilacion_media_diaria: 15.0
    viento: 2.0                # m/s, para el coeficiente exterior de verano
  fuente: "Valores ilustrativos. Usar la Guía técnica IDAE 'Condiciones climáticas exteriores de proyecto'."

interior:
  invierno: {temperatura: 21, humedad_relativa: 0.40}
  verano:   {temperatura: 25, humedad_relativa: 0.50}

local:
  nombre: "Sala de ventas"
  superficie: 85.0
  altura: 3.0
  ocupacion:
    actividad: comercio        # ver cargas_rite/datos/actividades.yaml
    m2_por_persona: 5          # o bien 'personas: 17'
  iluminacion: 10              # W/m²
  equipos: 5                   # W/m²
  horario: [10, 21]            # hora oficial

ventilacion:
  categoria_ida: IDA3          # o 'caudal_m3h: 500'
  eficiencia_recuperador: 0.0
  infiltracion_renovaciones_h: 0.3

cerramientos:
  - nombre: Fachada SO
    tipo: muro
    orientacion: SO
    area: 14.0
    absortividad: 0.6
    capas:
      - {material: "Enlucido de yeso 1000 < d < 1300", espesor: 0.015}
      - {material: "Tabique de LH sencillo [40 mm < Espesor < 60 mm]", espesor: 0.05}
      - {material: "MW Lana mineral [0.04 W/[mK]]", espesor: 0.05}
      - {material: "1/2 pie LP métrico o catalán 40 mm< G < 60 mm", espesor: 0.115}
  - nombre: Escaparate SO
    tipo: ventana
    orientacion: SO
    area: 10.0
    vidrio: "VER_DB1_4-6-4"      # doble bajo emisivo del catálogo CTE (da U y g)
    marco: "VER_Normal sin rotura de puente térmico"
    fraccion_marco: 0.15
    factor_sombra: 0.8         # toldo / retranqueo
    hojas: 2                   # nº de vidrios (corrección por ángulo de incidencia)
  - nombre: Medianera izquierda
    tipo: particion
    area: 45.0
    U: 1.20
    temperatura_adyacente: {invierno: 18, verano: 27}
  - nombre: Medianera derecha (local sin uso)
    tipo: particion
    area: 45.0
    U: 1.20
    temperatura_adyacente: {invierno: 12, verano: 30}
  - nombre: Forjado a viviendas
    tipo: particion
    posicion: techo
    area: 85.0
    temperatura_adyacente: {invierno: 20, verano: 26}
    capas:
      - {nombre: falso techo placa, espesor: 0.015, conductividad: 0.25, densidad: 900, calor_especifico: 1000}
      - {nombre: cámara,            espesor: 0.30,  resistencia: 0.16}
      - {nombre: forjado,           espesor: 0.30,  conductividad: 1.32, densidad: 1500, calor_especifico: 1000}
  - nombre: Solera
    tipo: suelo
    area: 85.0
    terreno:                   # U según UNE-EN ISO 13370 (DA DB-HE/1)
      perimetro: 8.5           # perímetro EXPUESTO (sólo la fachada; las medianeras no cuentan)
    capas:
      - {material: "Plaqueta o baldosa cerámica", espesor: 0.02}
      - {material: "Mortero de cemento o cal para albañilería y para revoco/enlucido 1800 < d < 2000", espesor: 0.04}
      - {material: "Hormigón armado 2300 < d < 2500", espesor: 0.15}

# Superficies interiores sin pérdidas que almacenan calor (sólo método dinámico).
masas_interiores:
  - nombre: Tabiques del almacén
    area: 20.0
    posicion: vertical
    capas:
      - {nombre: ladrillo hueco, espesor: 0.07, conductividad: 0.49, densidad: 1200, calor_especifico: 1000}

# Puentes térmicos (tipos de UNE-EN ISO 14683 / DA DB-HE/3). Valores ψ ILUSTRATIVOS:
# sustituir por los del DA DB-HE/3 o por cálculo. Si se indican, no se aplica el ΔU global.
puentes_termicos:
  - {tipo: IF, nombre: "Frente de forjado", longitud: 8.5, psi: 0.70}
  - {tipo: W,  nombre: "Contorno del escaparate", longitud: 13.0, psi: 0.15}
  - {tipo: GF, nombre: "Encuentro solera-fachada", longitud: 8.5, psi: 0.50}

coeficientes:
  mayoracion: 0.10
